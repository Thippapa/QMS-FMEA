<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quality Hub</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter', sans-serif;
            background:#eef3f9;
            color:#0f172a;
            height:100vh;
            overflow:hidden;
        }

        .app{
            display:flex;
            height:100vh;
            width:100%;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar{
            width:280px;

            background:
                linear-gradient(
                    180deg,
                    #0f172a 0%,
                    #081225 100%
                );

            color:white;

            padding:28px 20px;

            flex-shrink:0;

            display:flex;
            flex-direction:column;

            border-right:1px solid rgba(255,255,255,0.05);

            box-shadow:
                10px 0 30px rgba(0,0,0,0.15);
        }

        .brand{
            margin-bottom:40px;

            padding:6px 6px 18px;

            border-bottom:
                1px solid rgba(255,255,255,0.06);
        }

        .brand h2{
            font-size:28px;
            font-weight:800;

            letter-spacing:-1.2px;

            line-height:1.05;

            color:white;
        }

        .brand p{
            font-size:12px;

            color:#94a3b8;

            margin-top:8px;

            font-family:'Kanit', sans-serif;

            line-height:1.6;
        }

        .menu-title{
            font-size:11px;

            color:#64748b;

            font-weight:800;

            text-transform:uppercase;

            letter-spacing:1.3px;

            margin:0 12px 16px;
        }

        .menu{
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .menu a{
            position:relative;

            text-decoration:none;

            color:#cbd5e1;

            padding:16px 18px;

            border-radius:16px;

            font-size:15px;
            font-weight:700;

            letter-spacing:-0.2px;

            transition:0.22s ease;

            border:1px solid transparent;

            background:transparent;

            overflow:hidden;
        }

        .menu a:hover{
            background:#16233a;

            color:white;

            border-color:rgba(255,255,255,0.05);

            transform:translateX(2px);
        }

        .menu a.active{

            background:
                linear-gradient(
                    135deg,
                    #1e293b,
                    #16233a
                );

            color:white;

            border-color:rgba(255,255,255,0.05);

            box-shadow:
                0 12px 24px rgba(0,0,0,0.20);
        }

        .menu a.active::before{
            content:'';

            position:absolute;

            left:0;
            top:10px;
            bottom:10px;

            width:4px;

            border-radius:999px;

            background:#3b82f6;
        }

        /* =========================
           CONTENT
        ========================== */

        .content{
            flex:1;

            min-width:0;

            background:#eef3f9;

            padding:18px;
        }

        .frame-area{
            height:100%;
        }

        .frame-card{
            height:100%;

            background:white;

            border-radius:28px;

            overflow:hidden;

            border:1px solid #e2e8f0;

            box-shadow:
                0 10px 30px rgba(15,23,42,0.06);
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
            background:white;
        }

        /* =========================
           FOOTER
        ========================== */

        .sidebar-footer{
            margin-top:auto;

            padding-top:24px;

            font-size:11px;

            color:#64748b;

            line-height:1.8;

            font-family:'Kanit', sans-serif;
        }

        /* =========================
           SCROLLBAR
        ========================== */

        ::-webkit-scrollbar{
            width:10px;
            height:10px;
        }

        ::-webkit-scrollbar-thumb{
            background:#cbd5e1;
            border-radius:999px;
        }

        ::-webkit-scrollbar-track{
            background:transparent;
        }

    </style>

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">

            <h2>
                Quality Management System
            </h2>

            <p>
                FMEA & Control Plan System
            </p>

        </div>

        <div class="menu-title">
            Main Menu
        </div>

        <nav class="menu">

            <a
                href="{% url 'requirement_list' %}"
                target="dashboardFrame"
                class="active"
            >
                <span>Requirement Reference</span>
            </a>

            <a
                href="{% url 'model_dashboard' %}"
                target="dashboardFrame"
            >
                <span>Model Dashboard</span>
            </a>

            <a
                href="{% url 'approve_dashboard' %}"
                target="dashboardFrame"
            >
                <span>Approval Dashboard</span>
            </a>

            <a
                href="{% url 'cp_form' %}"
                target="dashboardFrame"
            >
                <span>Control Plan</span>
            </a>

        </nav>

        <div class="sidebar-footer">

            Quality Engineering Workspace

            <br>

            Dashboard Portal v1.0

        </div>

    </aside>

    <!-- CONTENT -->
    <main class="content">

        <div class="frame-area">

            <div class="frame-card">

                <iframe
                    name="dashboardFrame"
                    src="{% url 'requirement_list' %}">
                </iframe>

            </div>

        </div>

    </main>

</div>

<script>

    const menuLinks = document.querySelectorAll('.menu a');

    menuLinks.forEach(link => {

        link.addEventListener('click', () => {

            menuLinks.forEach(item => {
                item.classList.remove('active');
            });

            link.classList.add('active');

        });

    });

</script>

</body>
</html>
